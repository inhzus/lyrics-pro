[project]
name = "lyrics-pro"
version = "0.9.1"
description = "Follow macOS Music with locally romanized Cantonese and Hokkien lyrics"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["ToJyutping==3.2.0", "taibun==1.1.8"]

[project.scripts]
lyrics-pro = "lyrics_pro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.17,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B"]
